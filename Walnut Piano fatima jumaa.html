<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walnut Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDE6D6;--panel:#DCD0B8;--ink:#2B1A11;--muted:#6E5847;--brass:#8A6620;--felt:#8C1D26;--rail:#4A2C1C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E120C;--panel:#2D1D14;--ink:#F1E8D6;--muted:#B79F86;--brass:#D2A94F;--rail:#3A2216;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E120C;--panel:#2D1D14;--ink:#F1E8D6;--muted:#B79F86;--brass:#D2A94F;--rail:#3A2216;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:28px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
h1{font:600 clamp(2rem,6vw,3.4rem)/1.05 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);max-width:46ch}
button,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--brass)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.panel{background:var(--panel);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-bottom:14px}
.panel label{display:flex;align-items:center;gap:8px;color:var(--muted)}
input[type=range]{accent-color:var(--brass);width:110px}
.oct{display:flex;align-items:center;gap:8px;color:var(--muted)}.oct b{min-width:1.5em;text-align:center;color:var(--ink)}
.now{margin-left:auto;font-variant-numeric:tabular-nums;min-width:11ch;text-align:right}
.case{background:var(--rail);padding:18px 14px 16px;border-radius:16px 16px 10px 10px;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.kb{position:relative;display:flex;height:clamp(170px,32vw,260px);border-top:12px solid var(--felt);background:#0d0806;touch-action:none;user-select:none;-webkit-user-select:none}
.wk{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;background:linear-gradient(#fffdf6,#EFE6D0);border:1px solid #9b8b72;border-top:0;border-radius:0 0 6px 6px;color:#6b5a48;font-size:12px;text-align:center;white-space:pre;line-height:1.3}
.wk.on{background:linear-gradient(#EBD9A4,#D8BE7C);transform:translateY(2px)}
.bk{position:absolute;top:0;height:60%;width:4%;z-index:2;background:linear-gradient(#41332d,#120c09);border-radius:0 0 4px 4px;box-shadow:0 3px 4px rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:#cdbca2;font-size:11px}
.bk.on{background:linear-gradient(#7a5239,#3c241a);height:59%}
.wk::after,.bk::after{content:attr(data-l)}
.hint{color:var(--muted);font-size:14px;margin:14px 2px 0}
@media(max-width:560px){.wk,.bk{font-size:9px}.now{margin-left:0;text-align:left}}
</style></head>
<body><main>
<header><div><h1>Walnut Piano</h1><p>Play with your computer keyboard, click the keys, or tap on a phone.</p></div>
<button id="theme" type="button">Light / dark</button></header>

<section class="panel" aria-label="Sound controls">
<label>Tone <select id="tone"><option value="piano">Acoustic piano</option><option value="epiano">Electric piano</option><option value="organ">Organ</option><option value="synth">Synth</option><option value="bell">Bell</option></select></label>
<label>Volume <input id="vol" type="range" min="0" max="1" step=".01" value=".7"></label>
<label>Reverb <input id="rev" type="range" min="0" max="1" step=".01" value=".25"></label>
<div class="oct">Octave <button id="od" type="button" aria-label="Octave down">−</button><b id="ov">4</b><button id="ou" type="button" aria-label="Octave up">+</button></div>
<div class="now" id="now" aria-live="polite">Press a key</div>
</section>

<div class="case"><div class="kb" id="kb"></div></div>
<p class="hint">Keys A to ' play white notes, W E T Y U O P ] play the black ones. Z and X change octave.</p>

<section class="panel" aria-label="Recorder" style="margin-top:14px">
<button id="rec" type="button">Record</button><button id="play" type="button" disabled>Play back</button><button id="clr" type="button" disabled>Clear</button>
<span id="rst" style="color:var(--muted)">Nothing recorded yet.</span>
<label style="margin-left:auto"><input id="lab" type="checkbox" checked> Show key labels</label>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const NN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],WH=[0,2,4,5,7,9,11];
const MAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,';':16,"'":17,']':18};
const LET={};for(const k in MAP)LET[MAP[k]]=k.toUpperCase();
const TONES={
piano:{p:[[1,'sine',1],[2,'sine',.4],[3,'sine',.15],[4,'triangle',.08]],a:.005,d:.9,s:0,r:.12},
epiano:{p:[[1,'sine',1],[2,'sine',.25],[7,'sine',.05]],a:.01,d:1.4,s:0,r:.15},
organ:{p:[[1,'sine',1],[2,'sine',.6],[3,'sine',.3],[4,'sine',.2]],a:.02,d:.05,s:1,r:.06},
synth:{p:[[1,'sawtooth',.5],[1.005,'sawtooth',.5]],a:.02,d:.3,s:.6,r:.2,lp:1800},
bell:{p:[[1,'sine',1],[2.76,'sine',.4],[5.4,'sine',.2]],a:.003,d:1.6,s:0,r:.5}};
let oct=4,ctx,bus,wet,master,tone='piano',labels=true,recording=false,rec=[],t0=0,timers=[];
const active=new Map(),ptr=new Map(),kb=$('#kb'),base=()=>12*(oct+1);

// build keys: 15 white keys (C to C, two octaves) with black keys overlaid
const W=100/15;
for(let i=0;i<15;i++){const off=Math.floor(i/7)*12+WH[i%7];mk(off,0);}
for(let i=0;i<14;i++){const n=WH[i%7];if([0,2,5,7,9].includes(n)){mk(Math.floor(i/7)*12+n+1,1,(i+1)*W-2)}}
function mk(off,black,left){const el=document.createElement('div');el.className=black?'bk':'wk';el.dataset.off=off;if(black)el.style.left=left+'%';kb.appendChild(el)}
function relabel(){kb.querySelectorAll('[data-off]').forEach(el=>{const o=+el.dataset.off;let l=labels&&LET[o]||'';if(o%12==0)l+=(l?'\n':'')+'C'+(oct+o/12);el.dataset.l=l});$('#ov').textContent=oct}
relabel();

function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();
const comp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=+$('#vol').value;master.connect(comp);comp.connect(ctx.destination);
const conv=ctx.createConvolver(),n=ctx.sampleRate*1.8|0,b=ctx.createBuffer(2,n,ctx.sampleRate);
for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}
conv.buffer=b;wet=ctx.createGain();wet.gain.value=+$('#rev').value;conv.connect(wet);wet.connect(comp);
bus=ctx.createGain();bus.connect(master);bus.connect(conv)}

function voice(m){const T=TONES[tone],f=440*2**((m-69)/12),t=ctx.currentTime,g=ctx.createGain(),os=[];
let out=g;if(T.lp){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=T.lp;g.connect(lp);out=lp}out.connect(bus);
const tot=T.p.reduce((s,x)=>s+x[2],0);
T.p.forEach(([r,ty,a])=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=ty;o.frequency.value=f*r;og.gain.value=a/tot*.6;o.connect(og);og.connect(g);o.start(t);os.push(o)});
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+T.a);g.gain.setTargetAtTime(T.s,t+T.a,T.d);
return()=>{const n=ctx.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.setTargetAtTime(0,n,T.r);os.forEach(o=>o.stop(n+T.r*8+.1))}}

function light(m,on){const el=kb.querySelector(`[data-off="${m-base()}"]`);if(el)el.classList.toggle('on',on)}
function press(m,fromRec){init();ctx.resume();if(active.has(m))return;active.set(m,voice(m));light(m,1);
$('#now').textContent=NN[m%12]+(Math.floor(m/12)-1)+' · '+(440*2**((m-69)/12)).toFixed(1)+' Hz';
if(recording&&!fromRec)rec.push({t:performance.now()-t0,m,d:1})}
function release(m,fromRec){const s=active.get(m);if(!s)return;s();active.delete(m);light(m,0);if(recording&&!fromRec)rec.push({t:performance.now()-t0,m,d:0})}
function releaseAll(){[...active.keys()].forEach(m=>release(m))}

// pointer input, with glissando across keys
const go=(e,k)=>{const m=base()+ +k.dataset.off,p=ptr.get(e.pointerId);if(p===m)return;if(p!=null)release(p);ptr.set(e.pointerId,m);press(m)};
kb.addEventListener('pointerdown',e=>{const k=e.target.closest('[data-off]');if(!k)return;e.preventDefault();e.target.releasePointerCapture?.(e.pointerId);go(e,k)});
kb.addEventListener('pointerover',e=>{if(!e.buttons)return;const k=e.target.closest('[data-off]');if(k)go(e,k)});
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,e=>{const p=ptr.get(e.pointerId);if(p!=null){release(p);ptr.delete(e.pointerId)}}));

// computer keyboard
addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
if(k in MAP){e.preventDefault();press(base()+MAP[k])}else if(k==='z')shift(-1);else if(k==='x')shift(1)});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in MAP)release(base()+MAP[k])});
addEventListener('blur',releaseAll);

function shift(d){const n=Math.min(6,Math.max(1,oct+d));if(n===oct)return;releaseAll();oct=n;relabel()}
$('#od').onclick=()=>shift(-1);$('#ou').onclick=()=>shift(1);
$('#tone').onchange=e=>{tone=e.target.value;releaseAll()};
$('#vol').oninput=e=>{if(master)master.gain.value=+e.target.value};
$('#rev').oninput=e=>{if(wet)wet.gain.value=+e.target.value};
$('#lab').onchange=e=>{labels=e.target.checked;relabel()};
$('#theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};

// recorder
const rb=$('#rec'),pb=$('#play'),cb=$('#clr'),rs=$('#rst');
function sync(){pb.disabled=cb.disabled=!rec.length||recording;rb.textContent=recording?'Stop':'Record'}
rb.onclick=()=>{if(recording){recording=false;releaseAll();rs.textContent=rec.length?`Recorded ${rec.filter(x=>x.d).length} notes.`:'Nothing recorded yet.'}else{timers.forEach(clearTimeout);rec=[];t0=performance.now();recording=true;rs.textContent='Recording… play some notes.'}sync()};
pb.onclick=()=>{timers.forEach(clearTimeout);releaseAll();rs.textContent='Playing back…';rec.forEach(x=>timers.push(setTimeout(()=>x.d?press(x.m,1):release(x.m,1),x.t)));
timers.push(setTimeout(()=>{releaseAll();rs.textContent=`Recorded ${rec.filter(x=>x.d).length} notes.`},rec[rec.length-1].t+600))};
cb.onclick=()=>{timers.forEach(clearTimeout);rec=[];rs.textContent='Nothing recorded yet.';sync()};
</script></body></html>
